name: Bug report
description: Something is broken, such as a disguise that stopped hiding things
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the disguise is leaking after a site redeploy,
        that's the most useful kind of report this project gets. A screenshot of
        what's showing through usually pins it down immediately.

        **Security issues don't belong here.** Use the private advisory form linked
        in [SECURITY.md](https://github.com/antidepressive/HideLLM/blob/main/SECURITY.md).

  - type: dropdown
    id: site
    attributes:
      label: Which site?
      options:
        - ChatGPT
        - Claude
        - Gemini
        - Grok (experimental)
        - Perplexity (experimental)
        - DeepSeek (experimental)
        - Microsoft Copilot (experimental)
        - Not site-specific
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Which disguise?
      options:
        - Google Docs
        - Google Sheets
        - Microsoft Word
        - Microsoft Excel
        - Notion
        - Not disguise-specific
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Turn the disguise on
        3. …
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Very helpful for anything visual. Crop out anything private first.

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HideLLM version
      description: Shown at the top right of the options page.
      placeholder: 1.0.0
    validations:
      required: true
