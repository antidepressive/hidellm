name: Release

# Tag a commit `v1.2.3` and this attaches the packaged extension to a GitHub
# release. It does not publish to the Chrome Web Store; that step is manual and
# deliberately so.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check the tag matches the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $MANIFEST"
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Install by downloading the zip, unpacking it, and loading the folder
            at `chrome://extensions` with **Developer mode → Load unpacked**.

            See [CHANGELOG.md](https://github.com/antidepressive/HideLLM/blob/main/CHANGELOG.md)
            for what changed.
